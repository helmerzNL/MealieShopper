name: Releasechecklist
description: Standaardchecklist om een nieuwe versie uit te brengen
title: "Release x.y.z"
labels: ["release"]
body:
  - type: input
    id: version
    attributes:
      label: Versienummer
      description: Alleen X.Y.Z, zoals in het bestand `VERSION`.
      placeholder: "2.75.0"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Waar gaat de versie heen?
      options:
        - Beta (pull request naar beta)
        - Stabiel (promotie van beta naar main)
    validations:
      required: true

  - type: textarea
    id: highlights
    attributes:
      label: Belangrijkste wijzigingen
      description: Korte lijst voor de releasetekst.
    validations:
      required: true

  - type: checkboxes
    id: preparation
    attributes:
      label: Voorbereiding
      options:
        - label: "`VERSION` is verhoogd"
        - label: "`CHANGELOG.md` heeft bovenaan een kopje `## vX.Y.Z` met features, fixes, verwijderde dingen en pull requests"
        - label: Interface (`static/i18n/`), README's en voorbeeld-`.env`-bestanden zijn in het Nederlands en Engels gelijk
        - label: Nieuwe tabellen met gegevens staan in `backup.DATA_TABLES` of bewust in `EXCLUDED_TABLES`
        - label: Wijzigingen in Compose of `.env.example` zijn in de pull request als instructie voor de beheerder beschreven

  - type: checkboxes
    id: testing
    attributes:
      label: Testen
      options:
        - label: "`python -m unittest discover -s tests` slaagt"
        - label: De pull request richt zich op `beta` en de check `Pull request target` is groen
        - label: Bijwerken vanaf de vorige versie getest, met bestaande gegevens
        - label: Back-up maken en terugzetten getest bij wijzigingen aan de database
        - label: Gebruik op een telefoon (PWA) getest

  - type: checkboxes
    id: rollout
    attributes:
      label: Uitrol
      options:
        - label: Gemerged naar `beta`, de workflows `docker.yml` en `release.yml` zijn geslaagd
        - label: De pre-release `vX.Y.Z-beta` staat op GitHub met de tekst uit het changelog
        - label: Image `ghcr.io/helmerznl/mealieshopper:beta` is gebouwd
        - label: Alleen op verzoek van de eigenaar, de promotie van `beta` naar `main`
        - label: Alleen bij een promotie, de stabiele release `vX.Y.Z` en de image `latest` staan er

  - type: checkboxes
    id: after
    attributes:
      label: Na de release
      options:
        - label: Foutmeldingen en nieuwe issues worden in de gaten gehouden
        - label: Documentatie is bijgewerkt
