name: Bug melden
description: Er werkt iets niet in MealieShopper
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bedankt dat je dit meldt. Kijk eerst of er al een
        [bestaand issue](https://github.com/helmerzNL/MealieShopper/issues?q=is%3Aissue)
        over hetzelfde gaat.

        Zet nooit wachtwoorden, tokens, AI-sleutels of de inhoud van `secret.key` in een issue.

  - type: textarea
    id: summary
    attributes:
      label: Wat ging er mis?
      description: Beschrijf het probleem kort en concreet.
      placeholder: Na "Zet in de AH-mand" blijft de controlelijst leeg.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Hoe kunnen we het zelf zien gebeuren?
      value: |
        1. Ga naar '...'
        2. Klik op '...'
        3. Zie de fout
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Wat verwachtte je?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Waar gaat het om?
      multiple: true
      options:
        - Weekmenu en boodschappenlijst
        - Mand en controlelijst
        - Albert Heijn
        - Picnic
        - Jumbo
        - Mealie-koppeling
        - Aanbiedingen en receptsuggesties
        - Recepten zoeken of importeren
        - Inloggen, passkeys of gebruikers
        - Back-up en terugzetten
        - AI of MCP
        - Installatiehulp
        - Weet ik niet
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versie en commit
      description: Te vinden onder Instellingen, Over. Zet er ook bij of het de stabiele of de beta-versie is.
      placeholder: "v2.74.0 (a72cd41), stabiel"
    validations:
      required: true

  - type: dropdown
    id: usage
    attributes:
      label: Hoe gebruik je MealieShopper?
      options:
        - In de browser op een computer
        - In de browser op een telefoon of tablet
        - Geïnstalleerd als app (PWA) op een computer
        - Geïnstalleerd als app (PWA) op een telefoon of tablet
        - Via een AI-assistent (MCP)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser en besturingssysteem
      placeholder: "Chrome 140 op Windows 11, of Safari op iOS 18.5"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Foutmeldingen of logs
      description: Een melding uit de app, de browserconsole of `docker logs mealieshopper --tail 100`. Haal geheimen weg.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Schermafbeeldingen
      description: Sleep afbeeldingen hierheen als ze het probleem duidelijker maken. Let op dat er geen persoonlijke gegevens op staan.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Voor je verstuurt
      options:
        - label: Ik heb gezocht naar bestaande meldingen van deze bug
          required: true
        - label: Ik draai de nieuwste versie van MealieShopper
          required: false
