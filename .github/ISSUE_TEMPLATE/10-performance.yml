name: Prestaties
description: Traagheid of hoog geheugengebruik
title: "[Prestaties]: "
labels: ["performance"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Wat is traag of zwaar?
      placeholder: Het weekmenu laden duurt meer dan 10 seconden.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Soort probleem
      multiple: true
      options:
        - Traag laden
        - Haperend scrollen of bladeren
        - Hoog geheugengebruik van de server
        - Traag zoeken of opzoeken van producten
        - Traag bijwerken van de aanbiedingen
        - Trage back-up of herstel
        - Veel dataverkeer
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Wanneer gebeurt het?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Omvang van je gegevens
      description: Aantal recepten in Mealie, ingrediënten in het weekmenu of aanbiedingen in de historie helpt bij het vinden van schaalproblemen.
      placeholder: "ongeveer 1500 recepten"

  - type: input
    id: measurement
    attributes:
      label: Gemeten waarde
      description: Bijvoorbeeld laadtijd in seconden of geheugengebruik in MB.
      placeholder: "10,4 s tot het weekmenu staat"

  - type: input
    id: device
    attributes:
      label: Apparaat, browser en versie
      description: "Bij een probleem op de server: waarop draait de container, bijvoorbeeld een NAS of Raspberry Pi."
      placeholder: "Synology DS220+, Chrome 140, MealieShopper v2.74.0"
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: Meetgegevens
      description: Een Lighthouse-score, een prestatieprofiel uit de ontwikkelaarstools of `docker stats`. Niet verplicht, wel welkom.
