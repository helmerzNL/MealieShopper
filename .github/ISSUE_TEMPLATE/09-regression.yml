name: Regressie
description: Iets werkte vroeger en is nu stuk
title: "[Regressie]: "
labels: ["bug", "regression", "priority:high"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Wat werkt niet meer?
    validations:
      required: true

  - type: input
    id: last_good
    attributes:
      label: Laatste versie waarin het werkte
      placeholder: "2.73.1"
    validations:
      required: true

  - type: input
    id: first_bad
    attributes:
      label: Eerste versie waarin het stuk was
      placeholder: "2.74.0"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Welke lijn draai je?
      options:
        - Stabiel
        - Beta
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Hoe kunnen we het zelf zien gebeuren?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Waar gaat het om?
      multiple: true
      options:
        - Weekmenu en mand
        - Albert Heijn
        - Picnic
        - Jumbo
        - Mealie-koppeling
        - Aanbiedingen
        - Inloggen en gebruikers
        - Back-up en terugzetten
        - AI of MCP
        - Server en container
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Vermoedelijke commit of pull request
      description: Als je hebt gezocht of een vermoeden hebt.
      placeholder: "#134 of a1b2c3d"

  - type: textarea
    id: logs
    attributes:
      label: Foutmeldingen of logs
      render: shell
