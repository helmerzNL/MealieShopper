name: Tests

# Draait de testsuite op elke pull request naar beta en main, op elke push naar beta en met de hand (workflow_dispatch).
on:
  workflow_dispatch:
  pull_request:
    branches:
      - beta
      - main
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests draaien
        run: MEALIESHOPPER_TESTING=1 python -m pytest -q -m "not volume"
      # De volumetests draaien de zware paden op een database van productieschaal (een paar minuten): een eigen stap, zodat
      # een stilstand van de event loop daar los te zien is van een gewone fout.
      - name: Volumetests draaien
        run: MEALIESHOPPER_TESTING=1 python -m pytest -q -m volume
