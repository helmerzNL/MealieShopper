name: GitHub release

# Elke versie in VERSION krijgt een GitHub release, met de tekst uit CHANGELOG.md:
# - push naar beta: een pre-release `vX.Y.Z-beta` (eenmalig per versie, niet "latest");
# - push naar main (alleen vanuit beta): de stabiele release `vX.Y.Z`, als "latest".
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" = "beta" ]; then
            tag="$version-beta"
            flags="--prerelease"
            title="MealieShopper $version (beta)"
          else
            tag="$version"
            flags="--latest"
            title="MealieShopper $version"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag bestaat al."
            exit 0
          fi
          python3 scripts/release_notes.py "$version" > notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file notes.md \
            $flags
