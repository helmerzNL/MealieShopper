services:
  mealieshopper:
    # MEALIESHOPPER_TAG kies je in .env naast dit bestand: latest (stabiel, standaard) of beta.
    # Dezelfde waarde zet de app in de container, zodat een beta-build een beta-badge toont.
    image: ghcr.io/helmerznl/mealieshopper:${MEALIESHOPPER_TAG:-latest}
    container_name: mealieshopper
    restart: unless-stopped
    pull_policy: always
    # Alles in .env.unraid is optioneel: bij de eerste start loopt de app je door de beveiliging
    # en de koppelingen met Mealie en je supermarkten. Zonder dit bestand start de container ook.
    # (required: false vraagt Docker Compose 2.24 of nieuwer.)
    env_file:
      - path: .env.unraid
        required: false
    environment:
      MEALIESHOPPER_TAG: ${MEALIESHOPPER_TAG:-latest}
    ports:
      - "5959:8000"
    volumes:
      - "/mnt/user/appdata/mealieshopper:/data"
